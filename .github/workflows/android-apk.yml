name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "assets/icon.svg"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create Capacitor Android wrapper
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli @capacitor/assets
          python -m pip install cairosvg
          mkdir -p assets
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="assets/icon.svg",
              write_to="assets/icon.png",
              output_width=1024,
              output_height=1024,
          )
          PY
          npx capacitor-assets generate --android --assetPath assets
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.wird.quran",
            "appName": "Wird",
            "webDir": "www",
            "server": {
              "url": "https://latinalatina840-dot.github.io/Wird/",
              "cleartext": false
            }
          }
          EOF
          mkdir -p www
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body>Opening Wird…</body></html>' > www/index.html
          npx cap add android
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force(
                      'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                      'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                      'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  )
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wird-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
