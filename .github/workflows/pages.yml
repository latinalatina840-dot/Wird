name: Deploy Wird to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download Madinah Mushaf page images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/mushaf
          seq -w 1 604 | xargs -P 8 -I{} sh -c 'curl --fail --location --retry 3 --retry-delay 1 --silent --show-error "https://raw.githubusercontent.com/quran-ws/quran-svg/main/mushafs/hafs/kfqc/svg/{}.svg" -o "assets/mushaf/{}.svg"' _ {}
          test "$(find assets/mushaf -maxdepth 1 -name '*.svg' | wc -l)" -eq 604
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
